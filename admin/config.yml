backend:
  name: github
  repo: Jonsits/Usaviral24n
  branch: main
media_folder: "images"
public_folder: "/images"
collections:
    - name: "posts"
    label: "Posts"
    folder: "_posts"
    create: true
    fields:
            - {label: "Title", name: "title", widget: "string"}
            - {label: "Date", name: "date", widget: "datetime"}
            - {label: "Body", name: "body", widget: "markdown"}
