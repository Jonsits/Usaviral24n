<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>USA Viral 24N - Viral Stories 24/7</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<style>:root{--bg:#fffaf5;--ink:#1c1c1c;--ac:#0b3a8a;--or:#ff7a00}*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);font-family:system-ui,sans-serif}header{background:#fff;padding:10px 16px;border-bottom:3px solid var(--or);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}header .logo-left{display:flex;align-items:center}header .logo-left img{max-width:300px;width:100%;height:auto}@media(max-width:600px){header .logo-left img{max-width:220px}} .wrap{max-width:1100px;margin:20px auto;padding:0 14px} .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-top:20px} .card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px #0001} .card img{width:100%;height:180px;object-fit:cover} .card .p{padding:12px} .card h3{color:var(--ac);font-size:17px} footer{text-align:center;padding:30px;color:#666}</style></head><body>
<header><div class="logo-left"><img src="logo.png" alt="USA Viral 24N"></div></header>
<div class="wrap"><div id="news" class="grid"></div></div>
<footer>© 2026 USA Viral 24N.com</footer>
<script>
const news=[
{title:"Breaking: USA Viral News Trending Now",img:"https://picsum.photos/400/200?1"},
{title:"Latest Viral Stories Across America",img:"https://picsum.photos/400/200?2"},
{title:"Top 10 Most Shared Today",img:"https://picsum.photos/400/200?3"}
];
document.getElementById('news').innerHTML=news.map(n=>`<div class=card><img src="${n.img}"><div class=p><h3>${n.title}</h3></div></div>`).join('');
</script>
</body></html>
